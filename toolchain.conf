# ai-modules toolchain floor.
#
# One record per line: name|detect|minimum|macos|linux
#   name     the command checked with `command -v`
#   detect   the command whose output carries the tool's version
#   minimum  the lowest accepted version; empty when no version matters
#   macos    the install command on macOS; empty when none applies
#   linux    the install command on Linux; empty when none applies
#
# `make install` reads this file and reports every tool. The floor is a
# minimum: a newer tool satisfies it. Add a record when the repository needs
# a tool that a standard machine does not guarantee.
jq|jq --version|1.6|brew install jq|sudo apt-get install -y jq
markdownlint|markdownlint --version|0.40.0|brew install markdownlint-cli|sudo npm install -g markdownlint-cli
shellcheck|shellcheck --version|0.8.0|brew install shellcheck|sudo apt-get install -y shellcheck
